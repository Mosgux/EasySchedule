# EasySchedule NGINX Configuration for www.neemo.tech
# 适用于 Windows Server 2012 R2 + NGINX 部署
# Dev 模式配置 - 代理到开发服务器

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 访问日志
    access_log C:/apps/EasySchedule/logs/nginx_access.log main;
    error_log C:/apps/EasySchedule/logs/nginx_error.log;

    # 网站根目录
    root C:/apps/EasySchedule/frontend/dist;
    index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # EasySchedule 服务器配置
    server {
        listen 80;
        server_name www.neemo.tech localhost 127.0.0.1;

        # EasySchedule 前端 - 静态文件服务
        location /EasySchedule/ {
            alias C:/apps/EasySchedule/frontend/dist/;
            try_files $uri $uri/ /EasySchedule/index.html;

            # 缓存静态资源
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # EasySchedule API - 代理到后端开发服务器
        location /EasySchedule/api/ {
            proxy_pass http://127.0.0.1:4000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }

    
        # 健康检查端点
        location /EasySchedule/health {
            proxy_pass http://127.0.0.1:4000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # 安全头设置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Windows 特定配置
        client_max_body_size 10M;
        client_body_timeout 60s;
        client_header_timeout 60s;
        keepalive_timeout 65s;
        send_timeout 60s;

        # 安全限制
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 禁止访问敏感文件
        location ~* \.(env|log|conf|sql|backup)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}